    domain: cost_finops
    intent: current_resource.managed_identity_unused
    target_kinds: [ManagedIdentity]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Are any existing user-assigned managed identities not attached to a current resource?
      ko: 기존 사용자 할당 관리 ID 중 현재 리소스에 연결되지 않은 것이 있나요?
