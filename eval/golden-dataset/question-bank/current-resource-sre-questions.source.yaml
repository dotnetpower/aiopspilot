    target_kinds: [KeyVault, Certificate]
    temporal_scope: forecast
    result_shape: list
    required_context: server_scope
    wording:
      en: Which reviewed certificates or secrets in the existing key vault are approaching expiration?
      ko: 기존 Key Vault의 검토된 인증서 또는 비밀 중 만료가 가까운 것은 무엇인가요?
