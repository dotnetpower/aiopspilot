    intent: current_resource.storage_health
    target_kinds: [StorageAccount]
    temporal_scope: current
    result_shape: assessment
    required_context: server_scope
    wording:
      en: Is the existing storage account currently available without a verified service-health or data-plane warning?
      ko: 기존 스토리지 계정이 검증된 서비스 상태 또는 데이터 평면 경고 없이 현재 사용 가능한가요?
