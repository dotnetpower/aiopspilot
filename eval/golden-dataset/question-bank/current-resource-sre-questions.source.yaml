    domain: reliability_policy_automation
    intent: current_resource.managed_identity_role_risk
    target_kinds: [ManagedIdentity, RoleAssignment]
    temporal_scope: current
    result_shape: ranked_list
    required_context: server_scope
    wording:
      en: Which existing managed identities have role assignments broader than their reviewed operational need?
      ko: 기존 관리 ID 중 검토된 운영 필요 범위보다 넓은 역할 할당을 가진 것은 무엇인가요?
