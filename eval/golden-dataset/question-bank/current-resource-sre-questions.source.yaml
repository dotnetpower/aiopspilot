    domain: reliability_policy_automation
    intent: current_resource.storage_network_access
    target_kinds: [StorageAccount, VirtualNetwork]
    temporal_scope: current
    result_shape: assessment
    required_context: server_scope
    wording:
      en: What verified network paths can currently reach the existing storage account?
      ko: 현재 기존 스토리지 계정에 도달할 수 있는 검증된 네트워크 경로는 무엇인가요?
