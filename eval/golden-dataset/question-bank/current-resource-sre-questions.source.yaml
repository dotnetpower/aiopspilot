    domain: dependency_impact
    intent: current_resource.managed_identity_assignments
    target_kinds: [ManagedIdentity, AzureResource]
    temporal_scope: current
    result_shape: graph
    required_context: server_scope
    wording:
      en: Which current resources use each existing user-assigned managed identity?
      ko: 각 기존 사용자 할당 관리 ID를 현재 사용하는 리소스는 무엇인가요?
