    intent: current_resource.storage_capacity_trend
    target_kinds: [StorageAccount]
    temporal_scope: comparison
    result_shape: assessment
    required_context: server_scope
    wording:
      en: How has capacity consumption changed for the existing storage account over the reviewed observation window?
      ko: 검토된 관측 구간 동안 기존 스토리지 계정의 용량 소비가 어떻게 변했나요?
