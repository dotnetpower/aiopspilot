    intent: current_resource.key_vault_availability
    target_kinds: [KeyVault]
    temporal_scope: current
    result_shape: assessment
    required_context: server_scope
    wording:
      en: Is the existing key vault currently available, and when was that state last observed?
      ko: 기존 Key Vault가 현재 사용 가능하며, 해당 상태는 언제 마지막으로 관측되었나요?
