schema_version: "1.0.0"
source_id: current-resource-sre-questions-2026-09

questions:
  - id: current-resource.inventory-by-type
    category: current_health
    domain: state_incident_detection
    intent: current_resource.inventory_by_type
    target_kinds: [AzureResource]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Which Azure resources currently exist in the authorized scope, grouped by resource type?
      ko: 권한 범위에 현재 존재하는 Azure 리소스를 리소스 유형별로 묶어 보여 주세요.
  - id: current-resource.inventory-by-location
    category: current_health
    domain: state_incident_detection
    intent: current_resource.inventory_by_location
    target_kinds: [AzureResource]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: How are the currently existing Azure resources distributed by location and resource type?
      ko: 현재 존재하는 Azure 리소스가 위치와 리소스 유형별로 어떻게 분포되어 있나요?
  - id: current-resource.vm-power-state
    category: current_health
    domain: state_incident_detection
    intent: current_resource.vm_power_state
    target_kinds: [VirtualMachine]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: What is the current power state of each existing virtual machine in the authorized scope?
      ko: 권한 범위에 존재하는 각 가상 머신의 현재 전원 상태는 무엇인가요?
  - id: current-resource.vm-health-anomalies
    category: current_health
    domain: state_incident_detection
    intent: current_resource.vm_health_anomalies
    target_kinds: [VirtualMachine]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Do any existing virtual machines have a current health warning or unavailable state?
      ko: 현재 상태 경고가 있거나 사용할 수 없는 기존 가상 머신이 있나요?
  - id: current-resource.vm-utilization
    category: metrics_observability
    domain: capacity_performance_forecast
    intent: current_resource.vm_utilization
    target_kinds: [VirtualMachine]
    temporal_scope: current
    result_shape: ranked_list
    required_context: server_scope
    wording:
      en: Rank the existing virtual machines by current CPU and memory utilization with observation times.
      ko: 기존 가상 머신을 현재 CPU 및 메모리 사용률에 따라 순위화하고 관측 시각을 알려 주세요.
  - id: current-resource.vm-storage-network-dependencies
    category: dependency_impact
    domain: dependency_impact
    intent: current_resource.vm_storage_network_dependencies
    target_kinds: [VirtualMachine, ManagedDisk, NetworkInterface]
    temporal_scope: current
    result_shape: graph
    required_context: server_scope
    wording:
      en: Show the current disk and network-interface dependencies for every existing virtual machine.
      ko: 존재하는 모든 가상 머신의 현재 디스크 및 네트워크 인터페이스 의존 관계를 보여 주세요.
  - id: current-resource.disk-attachment-state
    category: current_health
    domain: state_incident_detection
    intent: current_resource.disk_attachment_state
    target_kinds: [ManagedDisk]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Which existing managed disks are attached, detached, or in an unknown attachment state?
      ko: 기존 관리 디스크 중 연결됨, 분리됨 또는 연결 상태를 알 수 없음인 디스크는 무엇인가요?
  - id: current-resource.disk-capacity-utilization
    category: capacity_scaling
    domain: capacity_performance_forecast
    intent: current_resource.disk_capacity_utilization
    target_kinds: [ManagedDisk]
    temporal_scope: current
    result_shape: ranked_list
    required_context: server_scope
    wording:
      en: Which existing managed disks are closest to their reviewed capacity limits?
      ko: 기존 관리 디스크 중 검토된 용량 한도에 가장 가까운 디스크는 무엇인가요?
  - id: current-resource.disk-unattached-cost
    category: cost_finops
    domain: cost_finops
    intent: current_resource.disk_unattached_cost
    target_kinds: [ManagedDisk]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Are any existing managed disks unattached and still incurring cost?
      ko: 기존 관리 디스크 중 연결되지 않았지만 비용이 계속 발생하는 디스크가 있나요?
  - id: current-resource.nic-attachment-addresses
    category: azure_infrastructure_network
    domain: dependency_impact
    intent: current_resource.nic_attachment_addresses
    target_kinds: [NetworkInterface, VirtualMachine]
    temporal_scope: current
    result_shape: graph
    required_context: server_scope
    wording:
      en: Show each existing network interface, its virtual-machine attachment, and its current private-address assignment.
      ko: 각 기존 네트워크 인터페이스의 가상 머신 연결 관계와 현재 사설 주소 할당 상태를 보여 주세요.
  - id: current-resource.public-ip-associations
    category: azure_infrastructure_network
    domain: dependency_impact
    intent: current_resource.public_ip_associations
    target_kinds: [PublicIPAddress, NetworkInterface]
    temporal_scope: current
    result_shape: graph
    required_context: server_scope
    wording:
      en: Which existing public IP resources are associated with a network interface or another frontend resource?
      ko: 기존 공용 IP 리소스 중 네트워크 인터페이스나 다른 프런트엔드 리소스에 연결된 것은 무엇인가요?
  - id: current-resource.public-ip-exposure
    category: azure_infrastructure_network
    domain: reliability_policy_automation
    intent: current_resource.public_ip_exposure
    target_kinds: [PublicIPAddress, NetworkSecurityGroup]
    temporal_scope: current
    result_shape: assessment
    required_context: server_scope
    wording:
      en: Which current public IP associations expose a reachable path, based on verified network controls?
      ko: 검증된 네트워크 제어를 기준으로 현재 도달 가능한 경로를 노출하는 공용 IP 연결은 무엇인가요?
  - id: current-resource.vnet-address-capacity
    category: capacity_scaling
    domain: capacity_performance_forecast
    intent: current_resource.vnet_address_capacity
    target_kinds: [VirtualNetwork]
    temporal_scope: current
    result_shape: assessment
    required_context: server_scope
    wording:
      en: How much reviewed address-space capacity remains in each existing virtual network?
      ko: 각 기존 가상 네트워크에 검토된 주소 공간 용량이 얼마나 남아 있나요?
  - id: current-resource.vnet-subnet-health
    category: azure_infrastructure_network
    domain: state_incident_detection
    intent: current_resource.vnet_subnet_health
    target_kinds: [VirtualNetwork, Subnet]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Do any subnets in the existing virtual networks have current delegation, route, or capacity issues?
      ko: 기존 가상 네트워크의 서브넷 중 현재 위임, 경로 또는 용량 문제가 있는 곳이 있나요?
  - id: current-resource.nsg-effective-rule-risk
    category: azure_infrastructure_network
    domain: reliability_policy_automation
    intent: current_resource.nsg_effective_rule_risk
    target_kinds: [NetworkSecurityGroup, NetworkInterface]
    temporal_scope: current
    result_shape: ranked_list
    required_context: server_scope
    wording:
      en: Which existing network security groups have the highest verified exposure risk from effective rules?
      ko: 기존 네트워크 보안 그룹 중 유효 규칙으로 인한 검증된 노출 위험이 가장 높은 것은 무엇인가요?
  - id: current-resource.bastion-connectivity
    category: azure_infrastructure_network
    domain: state_incident_detection
    intent: current_resource.bastion_connectivity
    target_kinds: [BastionHost, VirtualNetwork]
    temporal_scope: current
    result_shape: assessment
    required_context: server_scope
    wording:
      en: Is the existing Bastion host currently healthy and connected to its expected virtual network?
      ko: 기존 Bastion 호스트가 현재 정상이며 예상된 가상 네트워크에 연결되어 있나요?
  - id: current-resource.private-dns-link-health
    category: azure_infrastructure_network
    domain: state_incident_detection
    intent: current_resource.private_dns_link_health
    target_kinds: [PrivateDnsZone, VirtualNetworkLink]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Are all existing private DNS virtual-network links currently registered and healthy?
      ko: 기존 Private DNS 가상 네트워크 링크가 모두 현재 등록되어 정상 상태인가요?
  - id: current-resource.private-dns-unlinked-zones
    category: azure_infrastructure_network
    domain: dependency_impact
    intent: current_resource.private_dns_unlinked_zones
    target_kinds: [PrivateDnsZone, VirtualNetworkLink]
    temporal_scope: current
    result_shape: list
    required_context: server_scope
    wording:
      en: Which existing private DNS zones have no verified link to a virtual network?
      ko: 기존 Private DNS 영역 중 가상 네트워크에 대한 검증된 링크가 없는 것은 무엇인가요?
  - id: current-resource.private-dns-resolution-path
    category: dependency_impact
    domain: dependency_impact
    intent: current_resource.private_dns_resolution_path
    target_kinds: [PrivateDnsZone, VirtualNetwork, AzureResource]
    temporal_scope: current
    result_shape: graph
    required_context: server_scope
    wording:
      en: Show the verified private DNS resolution path from each linked virtual network to its current private endpoint services.
      ko: 연결된 각 가상 네트워크에서 현재 프라이빗 엔드포인트 서비스까지의 검증된 Private DNS 확인 경로를 보여 주세요.
