id: fdai-governance-kanban
version: 1
kind: kanban
updated: 2026-08-08
locales:
  en:
    title: FDAI governance Kanban
    description: Governed capability work advances through candidate, validation, and ready columns.
    alt: Three Kanban columns contain candidate, validation, and ready work items for policies and automated actions.
  ko:
    title: FDAI 거버넌스 칸반
    description: 통제된 기능 작업이 후보, 검증 및 준비 열을 거쳐 진행됩니다.
    alt: 정책과 자동화 작업을 위한 항목이 후보, 검증 및 준비의 세 칸반 열에 배치됩니다.
canvas: { width: 1400, height: 480, direction: RIGHT }
groups:
  - id: candidate
    kind: layer
    presentation: lane
    label: { en: Candidate, ko: 후보 }
  - id: validation
    kind: layer
    presentation: lane
    label: { en: Validation, ko: 검증 }
  - id: ready
    kind: layer
    presentation: lane
    label: { en: Ready, ko: 준비 }
nodes:
  - id: restart-policy
    parent: candidate
    kind: process
    tone: input
    label: { en: Restart policy, ko: 재시작 정책 }
    description: { en: A candidate policy proposal awaiting validation, ko: 검증을 기다리는 후보 정책 제안입니다 }
  - id: cost-action
    parent: candidate
    kind: process
    tone: input
    label: { en: Cost action, ko: 비용 작업 }
    description: { en: A candidate cost-governance action awaiting validation, ko: 검증을 기다리는 후보 비용 통제 작업입니다 }
  - id: scenario-pack
    parent: validation
    kind: process
    tone: policy
    label: { en: Scenario pack, ko: 시나리오 팩 }
    description: { en: A scenario pack under active validation, ko: 검증이 진행 중인 시나리오 팩입니다 }
  - id: rollback-proof
    parent: validation
    kind: process
    tone: policy
    label: { en: Rollback proof, ko: 롤백 증명 }
    description: { en: A rollback proof under active validation, ko: 검증이 진행 중인 롤백 증명입니다 }
  - id: notify-action
    parent: ready
    kind: process
    tone: model
    label: { en: Notification action, ko: 알림 작업 }
    description: { en: A notification action validated and ready for release, ko: 검증을 마치고 배포 준비가 완료된 알림 작업입니다 }
  - id: read-investigation
    parent: ready
    kind: process
    tone: model
    label: { en: Read investigation, ko: 읽기 조사 }
    description: { en: A read-only investigation validated and ready for release, ko: 검증을 마치고 배포 준비가 완료된 읽기 전용 조사입니다 }
edges: []
