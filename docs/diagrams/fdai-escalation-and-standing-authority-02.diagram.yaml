id: fdai-escalation-and-standing-authority-02
version: 1
kind: flowchart
updated: 2026-08-20
formats:
  - svg
locales:
  en:
    title: The re-decide path (no bypass)
    description: FDAI flow for The re-decide path (no bypass).
    alt: "The re-decide path (no bypass). The main stages are escalation supervisor / (ladder deadline + SA match),
      risk-gate / re-evaluates, Var / standing Approval, Thor / executes approved HIL action, delivery / remediation-PR
      / direct-api, audit (Saga) / reason: standing-authority sa-...id, terminal no-op / + A2 alert."
  ko:
    title: 재결정 경로(우회 없음)
    description: 재결정 경로(우회 없음)에 대한 FDAI 흐름입니다.
    alt: "재결정 경로(우회 없음). 주요 단계는 에스컬레이션 supervisor / (ladder deadline + SA 매치), risk-gate / 재평가, Var /
      상시 Approval, Thor / 승인된 HIL 액션 실행, 전달 / remediation-PR / direct-api, 감사(Saga) /
      reason: standing-authority sa-...id, 종료성 no-op / + A2 alert입니다."
canvas:
  width: 1050
  height: 630
  direction: RIGHT
groups: []
nodes:
  - id: sup
    kind: process
    shape: card
    label:
      en: escalation supervisor / (ladder deadline + SA match)
      ko: 에스컬레이션 supervisor / (ladder deadline + SA 매치)
  - id: rg
    kind: process
    shape: card
    label:
      en: risk-gate / re-evaluates
      ko: risk-gate / 재평가
  - id: v
    kind: process
    shape: card
    label:
      en: Var / standing Approval
      ko: Var / 상시 Approval
  - id: ex
    kind: process
    shape: card
    label:
      en: Thor / executes approved HIL action
      ko: Thor / 승인된 HIL 액션 실행
  - id: del
    kind: process
    shape: card
    label:
      en: delivery / remediation-PR / direct-api
      ko: 전달 / remediation-PR / direct-api
  - id: aud
    kind: process
    shape: card
    label:
      en: "audit (Saga) / reason: standing-authority sa-...id"
      ko: "감사(Saga) / reason: standing-authority sa-...id"
  - id: no
    kind: process
    shape: card
    label:
      en: terminal no-op / + A2 alert
      ko: 종료성 no-op / + A2 alert
edges:
  - id: flow-01
    from: sup
    to: rg
    kind: request
    label:
      en: re-enter
      ko: 재진입
  - id: flow-02
    from: rg
    to: v
    kind: request
    label:
      en: SA pins + envelope verified
      ko: SA pins + envelope 검증됨
  - id: flow-03
    from: v
    to: ex
    kind: request
  - id: flow-04
    from: ex
    to: del
    kind: request
  - id: flow-05
    from: del
    to: aud
    kind: request
  - id: flow-06
    from: rg
    to: no
    kind: request
    label:
      en: SA invalid / envelope exceeded
      ko: SA invalid / envelope 초과
  - id: flow-07
    from: no
    to: aud
    kind: request
