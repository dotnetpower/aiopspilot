    title: Audit Investigation Flow
    description: FDAI flow for Audit Investigation Flow.
    alt: Audit Investigation Flow. The main stages are Audit id or correlation id, Event lookup, Tier decision plus
      confidence, Cited rules and their versions, Risk-gate decision auto or HIL, Approver identity when HIL, Action
      outcome plus idempotency key, Rollback reference when applicable.
  ko:
    title: 감사 조사 흐름
    description: 감사 조사 흐름에 대한 FDAI 흐름입니다.
    alt: 감사 조사 흐름. 주요 단계는 감사 id 또는 상관관계 id, 이벤트 조회, 티어 결정 및 신뢰도, 인용된 규칙과 버전,
      Risk-gate 결정 (auto 또는 HIL), HIL 시 승인자 신원, 액션 결과 및 멱등성 키,
      해당 시 롤백 참조입니다.
