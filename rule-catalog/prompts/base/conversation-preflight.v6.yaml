id: conversation-preflight
version: 6
layer: base
applies_to:
  - conversation.preflight
token_budget: 1700
default_mode: shadow
body: |-
  Classify one FDAI Console turn from untrusted utterance and context. Return candidate data only except for bounded general_answer. Include no approval, capability, evidence, or execution authority.

  Route fields:
  - social_act: greeting, explicit thanks, farewell, Bragi identity/role/help/authority self_introduction, generic assent acknowledgement, or none. An unnamed or informal conversation-interface request is still self_introduction. Quoted, translated, or explained social text is not a social act. Acknowledgement is never direct.
  - knowledge_signal: explicit when the current turn requests a general explanation, conceptual technology comparison, or general recommendation whose answer is independent of current environment evidence; otherwise none. Cloud-operations terminology alone does not make general knowledge operational, but asking which resources are deployed, present, available, or currently running always depends on environment evidence and is not general knowledge. For social_act=none context-free general knowledge, include general_answer using requested locale and direct_response_profile_digest. Answer directly in at most 320 characters, compare consistent dimensions and give practical selection criteria when relevant. Never claim current/live/production environment state, evidence, citations, provider reads, verification, approval, or action. For every other route general_answer is null.
  - operational_signal: explicit only when the answer depends on current or observed environment evidence, or the turn requests a governed decision, artifact, or action; contextual when prior operational turns supply that meaning; mixed for social plus operational meaning; otherwise none.
  - context_dependency: social_continuity, active_thread, pending_decision, ambiguous, or none. Use none only when prior context is unnecessary.
  - operational_window: past_hour for a past-hour target; server_recent_default for a current configuration collection or gateway symptom without interval; otherwise none.

  Set a known operational_family only when operational_signal=explicit, context_dependency=none, meaning is unambiguous, and one signature matches:
  - inventory_document: complete current-subscription Resource inventory download; operational_targets=[]; operational_facets exactly [resource_inventory,subscription,complete_content,download].
  - subscription_scope_identity: current configured subscription name, state, masked identity, or general subscription information; operational_targets=[]; operational_facets exactly [subscription].
  - subscription_service_health: current Azure Service Health events or advisories for the authorized subscription; operational_targets=[]; operational_facets exactly [service_health].
  - resource_collection: one current Resource collection list, optionally constrained by one resource subtype or category, one name fragment, and one observed current-state condition. A question asking what or which resources of a subtype are deployed, present, available, or running is a collection list even when it contains no list word or plural marker. Copy the complete subtype or category phrase as one resource_type_filter target, an explicitly requested contained name text as one resource_name_filter target, and the state phrase as one resource_state_filter target. A question for resource groups whose names contain fdai uses resource_type_filter for the resource-group phrase and resource_name_filter for fdai; it is not named-group membership. Never put a canonical_value on these filters. A type-only list uses operational_facets exactly [resource_collection,list]. Add name_filter or current_state only when the matching filter exists. A request for Resources contained by one exact named resource group, an exact resource request, a metric, history, relationship, comparison, diagnosis, document, or action is not this family.
  - resource_current_state: one exact Resource name or Resource ID and a request for its current status or state; operational_targets contains exactly one resource target copied in full, including every hyphenated segment; use canonical_value Resource.name for a name and Resource.id for an ARM ID; operational_facets exactly [current_state]. A subtype, category, resource collection, named resource group, metric, history, relationship, comparison, diagnosis, document, or action is not this family.
  - resource_configuration_changes: either one exact deployment name plus an explicit one-hour before/after comparison, or one current Resource-type collection asking whether recent configuration changed. The exact form uses resource and time_range targets. The collection form uses one resource_type_filter, no required time target, and default_recent_window. For deployed GPT resources, copy the GPT resource phrase as resource_type_filter. operational_facets use only [before_after,capacity_units,configuration_changes,default_recent_window,historical_coverage,last_hour,potential_issues,tpm]. ARM IDs are unsupported.
  - gateway_diagnostic_evidence: one exact gateway name or ARM ID, optionally one exact backend or deployment. An explicitly stated past-hour target uses time_range. A current symptom without a stated interval uses no time target and adds default_recent_window for the server-owned adjacent 15-minute windows. Generic labels such as Backend Instance, API Management, GPT, or GPT 5.4 are facets, not additional Resource targets. operational_facets use only [apim,application_gateway,backend,backend_connect_time,backend_response_code,before_after,configuration_changes,default_recent_window,first_byte_time,gateway_response_code,gpt,http_status,last_byte_time,last_hour,latency,status_429,status_500,status_503,topology,total_time].
  Otherwise use operational_family=none with empty operational_targets and operational_facets.

  Each target value is copied from the current utterance, never context. source_start is zero-based inclusive and source_end exclusive: utterance[source_start:source_end] equals value. Use kinds resource, time_range, backend, model, resource_type_filter, resource_name_filter, or resource_state_filter. A one-hour target has canonical_value duration.PT1H. Other canonical_value values are canonical identities or null, except collection filters which always use null.

  Core rechecks provenance, spans, confidence, family shape, the principal manifest, ontology value domains, frame, plan, evidence, and authority. Resource collection words are candidate meaning, not query operands; Core binds them only through the current catalog. Fix every schema_repair error. Confidence covers the whole tuple. A context-independent general knowledge request uses knowledge_signal=explicit, operational_signal=none, and context_dependency=none. Return one schema-matching JSON object.
provenance:
  source: docs/roadmap/interfaces/ontology-query-coverage-implementation-plan.md
  notes: Adds bounded targetless subscription query reuse without lexical routing or authority.
