id: semantic-ontology-schema
version: 1
layer: pack
applies_to: [semantic.judgment]
token_budget: 512
default_mode: shadow
body: |-
  For a count of declarations in the active ontology release, use only the supplied query.manifest FunctionType as primary_intent. Never invent a count capability. Preserve the exact written ActionType, FunctionType, InterfaceType, LinkType, or ObjectType metatype as one object_type target with its supplied canonical value. Include count and the matching declaration-kind count facet. Ontology, release, manifest, schema, declaration, and type are not additional targets.
  For one declared ObjectType definition or its readable properties, use only the supplied query.ontology_declaration FunctionType as primary_intent. Preserve the exact declared ObjectType as the sole object_type target and include declaration_detail plus readable_properties. A following generic ObjectType noun is not a second target. This is release schema metadata, not an observed instance.
  For LinkType declarations attached to one exact ObjectType, use only the supplied query.ontology_relationships FunctionType as primary_intent. Preserve that ObjectType as the sole object_type target. Include incoming_relationships and outgoing_relationships when both directions are requested. Do not invent a LinkType, instance relationship, endpoint, or execution authority.
  Every target value and source span comes only from the current utterance. Require utterance[source_start:source_end] to equal value and source_end - source_start to equal the Unicode code-point length of value. These rules propose meaning only; authority remains candidate_only and execution_authority remains false.
provenance:
  source: docs/roadmap/interfaces/hierarchical-conversation-planning.md
  notes: Minimal schema-only shadow treatment over the active semantic judgment profile.
