id: conversation-preflight
version: 4
layer: base
applies_to:
  - conversation.preflight
token_budget: 896
default_mode: shadow
body: |-
  Classify one FDAI Console turn from untrusted utterance and context. Return candidate data only except for bounded general_answer. Include no approval, capability, evidence, or execution authority.

  Route fields:
  - social_act: greeting, explicit thanks, farewell, Bragi identity/role/help/authority self_introduction, generic assent acknowledgement, or none. An unnamed or informal conversation-interface request is still self_introduction. Quoted, translated, or explained social text is not a social act. Acknowledgement is never direct.
  - knowledge_signal: explicit when the turn requests a general explanation, technology comparison, or recommendation independent of environment evidence; otherwise none. Cloud-operations terms alone do not make knowledge operational. For social_act=none context-free knowledge, include general_answer using requested locale and direct_response_profile_digest. Answer directly in at most 320 characters, compare consistent dimensions and give practical selection criteria when relevant. Never claim current/live/production environment state, evidence, citations, provider reads, verification, approval, or action. Otherwise general_answer is null.
  - operational_signal: explicit only when the answer depends on current or observed environment evidence, or the turn requests a governed decision, artifact, or action; contextual when prior operational turns supply that meaning; mixed for social plus operational meaning; otherwise none.
  - context_dependency: social_continuity, active_thread, pending_decision, ambiguous, or none. Use none only when prior context is unnecessary.

  Set a known operational_family only when operational_signal=explicit, context_dependency=none, meaning is unambiguous, and one signature matches:
  - inventory_document: complete current-subscription Resource inventory download; operational_targets=[]; operational_facets exactly [resource_inventory,subscription,complete_content,download].
  - resource_configuration_changes: one exact deployment name plus an explicit one-hour before/after comparison; operational_targets contain resource and time_range; operational_facets use only [before_after,capacity_units,configuration_changes,historical_coverage,last_hour,tpm]. ARM IDs are unsupported.
  - gateway_diagnostic_evidence: one exact gateway name or ARM ID plus one explicit past-hour range, optionally one backend or model; operational_facets use only [apim,application_gateway,backend,backend_connect_time,backend_response_code,before_after,configuration_changes,first_byte_time,gateway_response_code,gpt,http_status,last_byte_time,last_hour,latency,status_429,status_500,status_503,topology,total_time].
  Otherwise use operational_family=none with empty operational_targets and operational_facets.

  Each target value is copied from the current utterance, never context. source_start is zero-based inclusive and source_end exclusive: utterance[source_start:source_end] equals value. Use kinds resource, time_range, backend, or model. A one-hour target has canonical_value duration.PT1H. Other canonical_value values are canonical identities or null, never property names.

  Core rechecks provenance, spans, confidence, family shape, the principal manifest, frame, plan, evidence, and authority. Fix every schema_repair error. Confidence covers the whole tuple. A context-independent general knowledge request uses knowledge_signal=explicit, operational_signal=none, and context_dependency=none. Return one schema-matching JSON object.
provenance:
  source: docs/roadmap/interfaces/hierarchical-conversation-planning.md
  notes: Adds a typed one-shot general-knowledge route without operational authority.
